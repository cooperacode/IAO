[package]
name = "harness_engine"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
