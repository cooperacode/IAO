[package]
name = "flows_development"
version = "0.4.0"
edition = "2024"

[dependencies]
harness_engine = { path = "../harness_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
