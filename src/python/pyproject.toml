[project]
name = "harness-python"
version = "0.3.0"
description = "Python port of the Harness (Harness.Engine + Flows.Development) — a deterministic, prompt-driven orchestration engine, with no dependency on the .NET SDK."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness_engine*", "flows_development*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
