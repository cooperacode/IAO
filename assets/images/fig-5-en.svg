<rect x="70.02" y="210.25" width="279.24" height="114.28" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="86.42" y="241.66" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(17, 17, 17)">HarnessJsonContext</text>
<text x="86.42" y="265.17" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Source-generated JSON: envelope, state,</text>
<text x="86.42" y="283.92" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">trace, config and features — no reflection.</text>
<rect x="364.07" y="210.25" width="279.24" height="114.28" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="380.47" y="241.66" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(17, 17, 17)">Native AOT</text>
<text x="380.47" y="265.17" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Optional native publish; the wrapper uses</text>
<text x="380.47" y="283.92" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">the binary when present and falls back to</text>
<text x="380.47" y="302.68" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">the DLL.</text>
