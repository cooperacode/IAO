<rect x="1001.79" y="210.25" width="526.19" height="76.77" fill="rgb(255, 255, 255)" stroke="rgb(119, 119, 119)" stroke-width="0.8" stroke-dasharray="2.4 1.76"/>
<text x="1018.19" y="241.66" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(85, 85, 85)">Execution sandbox</text>
<text x="1018.19" y="265.17" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(102, 102, 102)">Environment and permissions belong to the IDE and the driver.</text>
<rect x="1001.79" y="301.83" width="526.19" height="76.77" fill="rgb(255, 255, 255)" stroke="rgb(119, 119, 119)" stroke-width="0.8" stroke-dasharray="2.4 1.76"/>
<text x="1018.19" y="333.23" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(85, 85, 85)">Model API client</text>
<text x="1018.19" y="356.74" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(102, 102, 102)">The harness never calls a model nor manages provider tokens.</text>
