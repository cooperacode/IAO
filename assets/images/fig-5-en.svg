<text x="674.52" y="241.66" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(17, 17, 17)">GitCommand</text>
<text x="674.52" y="265.17" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Shell-safe runner via</text>
<text x="793.1" y="265.17" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">ArgumentList</text>
<text x="883.1" y="265.17" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">.</text>
<text x="674.52" y="283.92" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Excludes</text>
<text x="727.93" y="283.92" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">.harness/</text>
<text x="795.44" y="283.92" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">from add and</text>
<text x="674.52" y="302.68" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">commit.</text>
<line x1="69.62" y1="341.34" x2="937.77" y2="341.34" stroke="rgb(221, 221, 221)" stroke-width="0.8"/>
<text x="69.62" y="367.08" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="400" fill="rgb(102, 102, 102)">rev-parse → add -A → diff --cached → commit → status → rev-parse --short HEAD</text>
