<svg xmlns="http://www.w3.org/2000/svg" width="1598" height="560" viewBox="0 0 1598 560">
<rect width="1598" height="560" fill="#fff"/>
<rect x="0.4" y="0.4" width="1597.2" height="558.94" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="48.81" y="59.81" font-family="'IBM Plex Serif', Georgia, serif" font-size="15" font-weight="400" fill="rgb(17, 17, 17)" letter-spacing="0.3">Figure 3</text>
<text x="48.81" y="96.18" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="rgb(17, 17, 17)" letter-spacing="-0.26">Prompt and context layer</text>
<text x="48.81" y="122.67" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="rgb(85, 85, 85)">What leaves the harness each turn: an instruction block with input, response contract and only the skill required by the current step.</text>
<rect x="49.21" y="161.04" width="848.47" height="227.26" fill="rgb(240, 240, 240)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="71.62" y="201.53" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="rgb(17, 17, 17)">PromptFormatter</text>
<text x="71.62" y="231.34" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="rgb(68, 68, 68)">Composes the block handed to the driver and substitutes the tokens of the current state. Re-injects the driver context captured at</text>
<text x="827.49" y="231.34" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="400" fill="rgb(68, 68, 68)">start</text>
<text x="866.5" y="231.34" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="rgb(68, 68, 68)">.</text>
<rect x="72.02" y="253.86" width="260.42" height="60.82" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="84.42" y="278.77" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="600" fill="rgb(17, 17, 17)">input</text>
<text x="84.42" y="298.77" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(85, 85, 85)">state and artefacts read</text>
<rect x="343.24" y="253.86" width="260.42" height="60.82" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="355.64" y="278.77" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="600" fill="rgb(17, 17, 17)">response</text>
<text x="355.64" y="298.77" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(85, 85, 85)">JSON expected next turn</text>
<rect x="614.45" y="253.86" width="260.43" height="60.82" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="626.86" y="278.77" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="600" fill="rgb(17, 17, 17)">skills</text>
<text x="626.86" y="298.77" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(85, 85, 85)">one skill per step</text>
<line x1="71.62" y1="331.48" x2="875.28" y2="331.48" stroke="rgb(204, 204, 204)" stroke-width="0.8"/>
