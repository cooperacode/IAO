<text x="403.5" y="358.85" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="rgb(17, 17, 17)">$SMOKE</text>
<rect x="457.31" y="344.29" width="67.62" height="21.21" fill="rgb(255, 255, 255)" stroke="rgb(187, 187, 187)" stroke-width="0.8"/>
<text x="464.72" y="358.85" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="rgb(17, 17, 17)">$SUMMARY</text>
<rect x="531.73" y="344.29" width="61.02" height="21.21" fill="rgb(255, 255, 255)" stroke="rgb(187, 187, 187)" stroke-width="0.8"/>
<text x="539.13" y="358.85" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="rgb(17, 17, 17)">$RESULT</text>
<rect x="599.55" y="344.29" width="61.02" height="21.21" fill="rgb(255, 255, 255)" stroke="rgb(187, 187, 187)" stroke-width="0.8"/>
<text x="606.95" y="358.85" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="rgb(17, 17, 17)">$COMMIT</text>
<rect x="920.49" y="161.04" width="628.29" height="96.32" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="936.9" y="193.21" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="rgb(17, 17, 17)">HarnessConfig</text>
<text x="936.9" y="216.75" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Defaults, ceilings and docs folder loaded from</text>
<text x="1195.95" y="216.75" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">harness.json</text>
<text x="1285.95" y="216.75" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">on every process. A read failure never kills</text>
<text x="936.9" y="235.51" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">the run.</text>
<rect x="920.49" y="272.17" width="628.29" height="77.57" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="936.9" y="304.34" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="rgb(17, 17, 17)">DocsReader</text>
<text x="936.9" y="327.88" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Seeds the plan from</text>
<text x="1052.29" y="327.88" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">md/txt</text>
<text x="1097.29" y="327.88" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">files in deterministic order, honouring the character limit.</text>
<rect x="920.49" y="364.54" width="628.29" height="77.57" fill="rgb(255, 255, 255)" stroke="rgb(17, 17, 17)" stroke-width="0.8"/>
<text x="936.9" y="396.71" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="rgb(17, 17, 17)">PathResolver</text>
<text x="936.9" y="420.26" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="rgb(68, 68, 68)">Resolves skills, docs and configuration from the CWD, falling back to the binary's directory.</text>
