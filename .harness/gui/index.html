  <div id="__bundler_thumbnail">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" fill="#1e1e1e"></rect>
      <path d="M42 30 L20 60 L42 90" fill="none" stroke="#3b93ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M78 30 L100 60 L78 90" fill="none" stroke="#3b93ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    const artifactViewerScript = document.querySelector('script[data-artifact-viewer]')?.textContent;
    if (artifactViewerScript) {
      template = template.replace("</body>", "<script>" + artifactViewerScript + "<" + "/script></body>");
    }

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

: #1c3d5c;\n      --accent-600: #5aa6ff;\n      --accent-700: #7cb8ff;\n      --accent-800: #a8d0ff;\n\n      --ink-100: #333333;\n      --ink-200: #3a3a3a;\n      --ink-300: #4d4d4d;\n      --ink-700: #a6a6a6;\n      --ink-800: #cfcfcf;\n      --ink-900: #e6e6e6;\n\n      --blue: var(--accent);\n      --blue-soft: var(--accent-100);\n      --orange: #e2b93b;\n      --orange-soft: #3a2f14;\n      --green: #6bc46d;\n      --green-soft: #1c3320;\n      --yellow: #e2b93b;\n      --yellow-soft: #3a2f14;\n      --red: #f27979;\n      --red-soft: #3a1f1f;\n\n      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .28);\n    }\n\n    * { box-sizing: border-box; }\n    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); line-height: 1.5; font-size: 14.5px; }\n    button { font: inherit; }\n    code { font-family: var(--mono); }\n\n    .ghost-button { cursor: pointer; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 8px 13px; color: var(--ink); background: var(--card); font-size: .8rem; font-weight: 500; transition: .12s ease; }\n    .ghost-button:hover { background: var(--soft); border-color: var(--accent); }\n    .ghost-button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }\n    .ghost-button:disabled { opacity: .45; cursor: not-allowed; }\n    .ghost-button.danger { border-color: var(--red); color: var(--red); }\n    .ghost-button.danger:hover { background: var(--red-soft); }\n    .primary-button { cursor: pointer; border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 8px 15px; color: #fff; background: var(--accent); font-size: .8rem; font-weight: 600; transition: .12s ease; }\n    .primary-button:hover { background: var(--accent-600); }\n    .primary-button:active { background: var(--accent-700); }\n    .primary-button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }\n    .primary-button:disabled { opacity: .45; cursor: not-allowed; background: var(--ink-300); border-color: var(--ink-300); color: var(--ink-700); }\n\n    /* ---------------------------------------------------------------- App shell / sidebar */\n    .app-shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }\n    .sidebar { display: flex; flex-direction: column; gap: 22px; padding: 18px 14px; border-right: 1px solid var(--line-strong); background: var(--sidebar); position: sticky; top: 0; height: 100vh; overflow-y: auto; }\n    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; border-bottom: 1px solid var(--line-strong); margin-bottom: 4px; }\n    .brand-mark { width: 26px; height: 26px; border-radius: var(--radius-sm); flex: 0 0 auto; background: var(--accent); }\n    .brand-text strong { display: block; font-weight: 600; font-size: .95rem; letter-spacing: -.01em; }\n    .brand-text span { display: block; margin-top: 1px; color: var(--muted); font-size: .64rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }\n    .nav { display: flex; flex-direction: column; gap: 1px; }\n    .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; border-radius: var(--radius-sm); background: none; color: var(--muted); font-size: .84rem; font-weight: 500; text-align: left; cursor: pointer; transition: .12s ease; }\n    .nav-item svg { flex: 0 0 auto; width: 16px; height: 16px; }\n    .nav-item:hover { background: var(--soft); color: var(--ink); }\n    .nav-item.active { background: var(--accent-100); color: var(--accent); font-weight: 600; }\n    .nav-status { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-300); flex: 0 0 auto; }\n    .nav-status.running { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }\n    .nav-status.stopping { background: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-soft); }\n    .nav-status.crashed, .nav-status.error { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }\n    .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line-strong); display: flex; flex-direction: column; gap: 8px; }\n    .refresh-state { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); color: var(--muted); font-size: .74rem; background: var(--card); cursor: pointer; }\n    .refresh-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-300); }\n    .refresh-dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); animation: pulse 1.7s infinite; }\n    .refresh-dot.paused { background: var(--yellow); }\n    @keyframes pulse { 50% { opacity: .35; } }\n    .read-at { color: var(--faint); font-size: .68rem; padding: 0 2px; }\n    .read-at code { color: var(--muted); }\n    .theme-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); color: var(--muted); font-size: .74rem; background: var(--card); cursor: pointer; }\n    .theme-toggle:hover { background: var(--soft); border-color: var(--accent); }\n    .theme-toggle svg { width: 15px; height: 15px; flex: 0 0 auto; }\n\n    .main { min-width: 0; padding: 28px 36px 60px; }\n    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line-strong); }\n    .section-kicker { margin: 0 0 6px; color: var(--accent); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }\n    .page-header h1 { margin: 0 0 6px; font-weight: 600; font-size: clamp(1.35rem, 2.6vw, 1.7rem); letter-spacing: -.01em; }\n    .page-subtitle { margin: 0; max-width: 640px; color: var(--muted); font-size: .87rem; }\n\n    .notice { display: none; align-items: flex-start; gap: 11px; padding: 13px 15px; margin-bottom: 20px; border: 1px solid var(--yellow); border-left: 3px solid var(--yellow); border-radius: var(--radius); color: var(--ink); background: var(--yellow-soft); font-size: .85rem; }\n    .notice.show { display: flex; }\n    .notice strong { display: block; margin-bottom: 2px; color: var(--ink); }\n\n    .panel { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }\n\n    /* View router: each page is a flex column of panels/grids, spaced uniformly */\n    .view { display: flex; flex-direction: column; gap: 18px; }\n    .view[hidden] { display: none; }\n\n    /* Control panel */\n    .control-panel { padding: 22px 24px; }\n    .control-grid { display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 16px; margin-bottom: 14px; }\n    .field { display: flex; flex-direction: column; gap: 6px; font-size: .76rem; color: var(--muted); }\n    .field select { padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); font: inherit; }\n    .field select:disabled { opacity: .5; }\n    .field-note { display: block; margin: -4px 0 12px; color: var(--faint); font-size: .68rem; }\n    .field-note:empty { display: none; }\n    .confirm-gate { display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px; margin-bottom: 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--soft); font-size: .8rem; color: var(--ink); }\n    .confirm-gate input { margin-top: 3px; accent-color: var(--accent); }\n    .control-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n    .control-error { color: var(--red); font-size: .78rem; font-weight: 500; }\n    .active-badge { display: none; align-items: center; gap: 6px; padding: 5px 9px; border-radius: var(--radius-sm); font-size: .7rem; font-weight: 600; color: var(--yellow); background: var(--yell n            <div class=\"panel-heading\"><h2>Brief e progresso<\u002Fh2><span class=\"meta\" id=\"artifact-meta\">artefatos<\u002Fspan><\u002Fdiv>\n            <pre id=\"artifact-copy\" class=\"artifact-copy\">Nenhum brief ou progress.txt disponível.<\u002Fpre>\n          <\u002Farticle>\n        <\u002Fsection>\n      <\u002Fsection>\n\n      <!-- ==================================================================== Specification -->\n      <section id=\"view-specification\" class=\"view\" hidden=\"\">\n        <section class=\"panel control-panel\" aria-label=\"Controle do driver de specification\">\n          <div class=\"panel-heading\">\n            <h2>Controle do driver<\u002Fh2>\n            <span id=\"active-badge-specification\" class=\"active-badge\">execução autônoma ativa — grava arquivos e pode commitar<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"control-grid\">\n            <label class=\"field\">\n              <span>Driver<\u002Fspan>\n              <select id=\"driver-select-specification\"><\u002Fselect>\n            <\u002Flabel>\n            <div class=\"field\">\n              <span>Status do processo<\u002Fspan>\n              <span id=\"process-status-pill-specification\" class=\"status-pill idle\"><span class=\"status-dot\"><\u002Fspan><span id=\"process-status-text-specification\">Ocioso<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span id=\"driver-note-specification\" class=\"field-note\"><\u002Fspan>\n          <span id=\"wrapper-note-specification\" class=\"field-note\"><\u002Fspan>\n          <label class=\"confirm-gate\">\n            <input type=\"checkbox\" id=\"confirm-checkbox-specification\">\n            <span>Autorizo esta execução autônoma, que pode escrever arquivos e criar commits sem revisão prévia.<\u002Fspan>\n          <\u002Flabel>\n          <div class=\"control-actions\">\n            <button id=\"start-button-specification\" class=\"primary-button\" type=\"button\" disabled=\"\">Iniciar<\u002Fbutton>\n            <button id=\"stop-button-specification\" class=\"ghost-button danger\" type=\"button\" disabled=\"\">Parar<\u002Fbutton>\n            <span id=\"control-error-specification\" class=\"control-error\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel approval-panel\" id=\"approval-panel-specification\" hidden=\"\" aria-label=\"Aprovação pendente\">\n          <div class=\"panel-heading\"><h2>Aprovação pendente<\u002Fh2><span class=\"meta\">status: <code id=\"approval-run-status\">—<\u002Fcode><\u002Fspan><\u002Fdiv>\n          <p class=\"notice-copy\">O run está parado aguardando aprovação. A decisão abaixo já foi proposta por uma sessão anterior — revise antes de confirmar. Isso executa <code>run-specification.sh<\u002Fcode> diretamente (sem passar pelo driver de IA) e publica em <code>specs/active/<\u002Fcode> se aprovado.<\u002Fp>\n          <dl class=\"data-list\" id=\"approval-summary\"><\u002Fdl>\n          <label class=\"confirm-gate\" style=\"margin-top: 14px;\">\n            <input type=\"checkbox\" id=\"confirm-checkbox-approve\">\n            <span>Revisei a decisão acima e confirmo a aprovação — isso roda <code>run-specification.sh<\u002Fcode> uma vez e publica em <code>specs/active/<\u002Fcode> se aprovado.<\u002Fspan>\n          <\u002Flabel>\n          <div class=\"control-actions\">\n            <button id=\"approve-button\" class=\"primary-button\" type=\"button\" disabled=\"\">Aprovar<\u002Fbutton>\n            <span id=\"approve-error\" class=\"control-error\"><\u002Fspan>\n          <\u002Fdiv>\n          <pre id=\"approve-result\" class=\"console-log\" hidden=\"\" style=\"margin-top: 14px;\"><\u002Fpre>\n        <\u002Fsection>\n\n        <section class=\"panel pipeline-panel\" aria-label=\"Pipeline de fases\">\n          <div class=\"panel-heading\"><h2>Pipeline<\u002Fh2><span class=\"meta\" id=\"pipeline-meta\">—<\u002Fspan><\u002Fdiv>\n          <div id=\"pipeline-stepper\" class=\"pipeline-stepper\"><\u002Fdiv>\n          <div id=\"pipeline-fault\" class=\"fault-callout\" hidden=\"\"><\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel documents-panel\" aria-label=\"Documentos da especificação\">\n          <div class=\"panel-heading\"><h2>Documentos da especificação<\u002Fh2><span class=\"meta\" id=\"documents-meta\">—<\u002Fspan><\u002Fdiv>\n          <div id=\"documents-list\" class=\"documents-list\"><\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel panel-section\">\n          <div class=\"panel-heading\"><h2>Console ao vivo<\u002Fh2><span class=\"meta\" id=\"console-meta-specification\">nenhum processo<\u002Fspan><\u002Fdiv>\n          <pre id=\"console-log-specification\" class=\"console-log\">Nenhum processo em execução. Inicie um driver acima.<\u002Fpre>\n        <\u002Fsection>\n      <\u002Fsection>\n\n      <!-- ===================================================================== Development -->\n      <section id=\"view-development\" class=\"view\" hidden=\"\">\n        <section class=\"panel control-panel\" aria-label=\"Controle do driver de development\">\n          <div class=\"panel-heading\">\n            <h2>Controle do driver<\u002Fh2>\n            <span id=\"active-badge-development\" class=\"active-badge\">execução autônoma ativa — grava arquivos e pode commitar<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"control-grid\">\n            <label class=\"field\">\n              <span>Driver<\u002Fspan>\n              <select id=\"driver-select-development\"><\u002Fselect>\n            <\u002Flabel>\n            <div class=\"field\">\n              <span>Status do processo<\u002Fspan>\n              <span id=\"process-status-pill-development\" class=\"status-pill idle\"><span class=\"status-dot\"><\u002Fspan><span id=\"process-status-text-development\">Ocioso<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span id=\"driver-note-development\" class=\"field-note\"><\u002Fspan>\n          <span id=\"wrapper-note-development\" class=\"field-note\"><\u002Fspan>\n          <p class=\"field-note\" style=\"margin-top: 0;\">Development consome <code>specs/active/<\u002Fcode>, publicado pelo specification — não há um gerenciador de fontes próprio para este fluxo (veja a página Specs).<\u002Fp>\n          <label class=\"confirm-gate\">\n            <input type=\"checkbox\" id=\"confirm-checkbox-development\">\n            <span>Autorizo esta execução autônoma, que pode escrever arquivos e criar commits sem revisão prévia.<\u002Fspan>\n          <\u002Flabel>\n          <div class=\"control-actions\">\n            <button id=\"start-button-development\" class=\"primary-button\" type=\"button\" disabled=\"\">Iniciar<\u002Fbutton>\n            <button id=\"stop-button-development\" class=\"ghost-button danger\" type=\"button\" disabled=\"\">Parar<\u002Fbutton>\n            <span id=\"control-error-development\" class=\"control-error\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel panel-section\">\n          <div class=\"panel-heading\"><h2>Console ao vivo<\u002Fh2><span class=\"meta\" id=\"console-meta-development\">nenhum processo<\u002Fspan><\u002Fdiv>\n          <pre id=\"console-log-development\" class=\"console-log\">Nenhum processo em execução. Inicie um driver acima.<\u002Fpre>\n        <\u002Fsection>\n      <\u002Fsection>\n\n      <!-- ============================================================================ Specs -->\n      <section id=\"view-specs\" class=\"view\" hidden=\"\">\n        <section class=\"panel panel-section\" aria-label=\"Gestão de arquivos de specs/sources\">\n          <div class=\"panel-heading\"><h2>Fontes da especificação · specs/sources<\u002Fh2><span class=\"meta\" id=\"sources-meta\">0 arquivos<\u002Fspan><\u002Fdiv>\n          <p class=\"sources-warning\">Estes arquivos não são versionados (specs/ está no .gitignore) e só são lidos no início de uma nova run de specification — editar depois do \"Iniciar\" não altera o que já foi ingerido. Development não lê esta pasta: ele consome <code>specs/active/<\u002Fcode>, publicado pelo specification.<\u002Fp>\n          <div class=\"budget-bar\"><span id=\"budget-fill\"><\u002Fspan><\u002Fdiv>\n          <div id=\"budget-label\" class=\"budget-label\">0 / 0 bytes<\u002Fdiv>\n          <div id=\"sources-list\" class=\"file-list\"><div class=\"empty\">Nenhum arquivo em specs/sources ainda.<\u002Fdiv><\u002Fdiv>\n          <form id=\"sources-form\" class=\"sources-form\">\n            <div class=\"sources-form-row\">\n              <input type=\"text\" id=\"sources-filename\" placeholder=\"nome-do-arquivo.md\" required=\"\" style=\"flex: 1;\">\n              <input type=\"file\" id=\"sources-file-input\" accept=\".md,.txt\">\n            <\u002Fdiv>\n            <textarea id=\"sources-content\" placeholder=\"Cole aqui o conteúdo, ou selecione um arquivo .md/.txt ao lado\" rows=\"4\"><\u002Ftextarea>\n            <div class=\"sources-form-row\">\n              <button type=\"submit\" class=\"primary-button\">Salvar arquivo<\u002Fbutton>\n              <span id=\"sources-status\" class=\"sources-status\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fform>\n        <\u002Fsection>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <script>\n    (() => {\n      const REFRESH_MS = 2000;\n      const state = { auto: localStorage.getItem(\"harness-gui-auto\") !== \"false\", timer: null, lastRead: null, refreshPromise: null, activeView: \"dashboard\" };\n      const $ = (id) => document.getElementById(id);\n\n      // ---------------------------------------------------------------------------------\n      // Light/dark theme toggle — presentation-only, persisted, defaults to system preference.\n      // ---------------------------------------------------------------------------------\n      const SUN_PATH = '<path d=\"M12 4.5v-2M12 21.5v-2M4.5 12h-2M21.5 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/>';\n      const MOON_PATH = '<path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/>';\n      function applyTheme(theme) {\n        document.documentElement.setAttribute(\"data-theme\", theme);\n        localStorage.setItem(\"harness-gui-theme\", theme);\n        $(\"theme-toggle\").setAttribute(\"aria-pressed\", String(theme === \"dark\"));\n        $(\"theme-toggle-label\").textContent = theme === \"dark\" ? \"Tema claro\" : \"Tema escuro\";\n        $(\"theme-toggle-icon\").innerHTML = theme === \"dark\" ? SUN_PATH : MOON_PATH;\n      }\n      const storedTheme = localStorage.getItem(\"harness-gui-theme\");\n      applyTheme(storedTheme || (window.matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\"));\n      $(\"theme-toggle\").addEventListener(\"click\", () => {\n        applyTheme(document.documentElement.getAttribute(\"data-theme\") === \"dark\" ? \"light\" : \"dark\");\n      });\n\n      const SOURCE_KEYS = [\"state\", \"features\", \"config\", \"trace\", \"inbox\", \"artifacts\", \"brief\", \"progress\"];\n\n      const text = (value, fallback = \"—\") => value === undefined || value === null || value === \"\" ? fallback : String(value);\n      const escape = (value) => text(value, \"\").replace(/[&<>\"']/g, (char) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[char]));\n      const formatNumber = (value) => new Intl.NumberFormat(\"pt-BR\").format(Number(value) || 0);\n      const formatPercent = (value) => new Intl.NumberFormat(\"pt-BR\", { style: \"percent\", maximumFractionDigits: 1 }).format(value);\n      const contextUsage = (event) => {\n        const used = Number(event.contextUsedTokens);\n        const window = Number(event.contextWindowTokens);\n        if (!Number.isFinite(used) || !Number.isFinite(window) || window <= 0) return \"\";\n        const ratio = Number(event.contextRatio);\n        const percentage = Number.isFinite(ratio) ? ratio : used / window;\n        if (!Number.isFinite(percentage)) return \"\";\n        return {\n          used: formatNumber(used),\n          window: formatNumber(window),\n          percentage: formatPercent(percentage),\n          fill: `${Math.min(Math.max(percentage, 0), 1) * 100}%`,\n          ariaPercentage: Math.min(Math.max(percentage * 100, 0), 100)\n        };\n      };\n      const formatDate = (value) => {\n        if (!value) return \"—\";\n        const date = new Date(value);\n        return Number.isNaN(date.getTime()) ? text(value) : new Intl.DateTimeFormat(\"pt-BR\", { dateStyle: \"short\", timeStyle: \"medium\" }).format(date);\n      };\n      const shortDate = (value) => {\n        if (!value) return \"—\";\n        const date = new Date(value);\n        return Number.isNaN(date.getTime()) ? text(value) : new Intl.DateTimeFormat(\"pt-BR\", { day: \"2-digit\", month: \"2-digit\", hour: \"2-digit\", minute: \"2-digit\" }).format(date);\n      };\n      const statusLabel = (value) => ({ instruction: \"instrução\", stop: \"parou\", error: \"erro\", budget: \"limite\", timeout: \"timeout\" }[value] || text(value, \"desconhecido\"));\n      const statusClass = (value) => ({ instruction: \"instruction\", stop: \"stop\", error: \"error\", budget: \"budget\", timeout: \"timeout\" }[value] || \"\");\n      const isFileProtocol = window.location.protocol === \"file:\";\n\n      async function fetchSource(key) {\n        try {\n          const response = await fetch(`/api/files/${key}?_=${Date.now()}`, { cache: \"no-store\" });\n          if (!response.ok) return { path: key, text: \"\", exists: false };\n          return await response.json();\n        } catch (_) {\n          return { path: key, text: \"\", exists: false };\n        }\n      }\n\n      async function readSources() {\n        const entries = await Promise.all(SOURCE_KEYS.map(async (key) => [key, await fetchSource(key)]));\n        return Object.fromEntries(entries);\n      }\n\n      function parseJson(result, fallback) {\n        try { return result.text ? JSON.parse(result.text) : fallback; } catch (_) { return fallback; }\n      }\n\n      function parseTrace(raw) {\n        const events = [];\n        let invalid = 0;\n        for (const line of raw.split(/\\r?\\n/).filter(Boolean)) {\n          try { events.push(JSON.parse(line)); } catch (_) { invalid++; }\n        }\n        return { events, invalid };\n      }\n\n      function deriveStatus(stateData, features, events) {\n        const terminal = text(stateData.TerminalReason, \"\");\n        const latest = events.at(-1);\n        if (terminal) return { key: \"warning\", label: \"Interrompido\", detail: terminal };\n        if (features.length && features.every((feature) => feature.passes === true)) return { key: \"done\", label: \"Concluído\", detail: \"Todas as features passaram\" };\n        if (latest?.outcome === \"error\") return { key: \"error\", label: \"Erro\", detail: \"O último evento registrou um erro\" };\n        if (latest?.outcome === \"timeout\") return { key: \"error\", label: \"Timeout\", detail: \"A execução excedeu o tempo configurado\" };\n        if (latest?.outcome === \"budget\") return { key: \"warning\", label: \"Limite atingido\", detail: \"A execução atingiu o orçamento de passos\" };\n        if (events.length || features.length || stateData.Step > 0) return { key: \"running\", label: \"Em execução\", detail: \"O harness está acompanhando o próximo estado\" };\n        return { key: \"waiting\", label: \"Aguardando\", detail: \"Inicie o harness para acompanhar o progresso\" };\n      }\n\n      function renderFeatures(features, currentId) {\n        $(\"feature-count\").textContent = `${features.length} ${features.length === 1 ? \"item\" : \"itens\"}`;\n        const list = $(\"feature-list\");\n        if (!features.length) { list.innerHTML = '<div class=\"empty\">O backlog aparecerá após a etapa de planejamento.<\u002Fdiv>'; return; }\n        list.innerHTML = features.map((feature) => {\n          const active = String(feature.id) === String(currentId) && !feature.passes;\n          const done = feature.passes === true;\n          const dependencies = Array.isArray(feature.dependsOn) && feature.dependsOn.length ? `depende de #${feature.dependsOn.join(\", #\")}` : \"sem dependências\";\n          const kind = done ? \"done\" : active ? \"active\" : \"\";\n          const label = done ? \"concluída\" : active ? \"em andamento\" : \"pendente\";\n          return `<div class=\"feature-item ${kind}\"><div class=\"feature-top\"><span class=\"feature-icon\">${done ? \"✓\" : active ? \"→\" : escape(feature.id)}<\u002Fspan><div class=\"feature-title\"><span class=\"feature-id\">#${escape(feature.id)}<\u002Fspan> ${escape(feature.title || \"Feature sem título\")}<\u002Fdiv><span class=\"feature-state\">${label}<\u002Fspan><\u002Fdiv><div class=\"feature-meta\"><span class=\"tag\">prioridade ${escape(feature.priority || \"—\")}<\u002Fspan><span>${escape(dependencies)}<\u002Fspan><\u002Fdiv><div class=\"feature-bar\"><span><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n        }).join(\"\");\n      }\n\n      function renderTrace(events, invalid) {\n        $(\"trace-count\").textContent = `${events.length} ${events.length === 1 ? \"evento\" : \"eventos\"}${invalid ? ` · ${invalid} inválido${invalid === 1 ? \"\" : \"s\"}` : \"\"}`;\n        const list = $(\"trace-list\");\n        if (!events.length) { list.innerHTML = '<div class=\"empty\">Os eventos do harness aparecerão aqui.<\u002Fdiv>'; return; }\n        list.innerHTML = events.slice(-24).reverse().map((event) => {\n          const outcome = text(event.outcome, \"evento\");\n          const label = event.label || (event.command ? `comando: ${event.command}` : \"sem label\");\n          const usage = contextUsage(event);\n          const context = usage ? `<div class=\"trace-context\"><div class=\"trace-context-meta\"><span>${usage.used} / ${usage.window} tokens<\u002Fspan><span>${usage.percentage}<\u002Fspan><\u002Fdiv><div class=\"trace-gauge\" role=\"progressbar\" aria-label=\"Uso da janela de contexto\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"${usage.ariaPercentage}\"><span style=\"width:${usage.fill}\"><\u002Fspan><\u002Fdiv><\u002Fdiv>` : \"\";\n          return `<div class=\"trace-item\"><div class=\"trace-step\">#${escape(event.step)}<\u002Fdiv><div class=\"trace-main\"><div class=\"trace-command\">${escape(event.command || \"—\")}<\u002Fdiv><div class=\"trace-label\">${escape(label)} · ${formatNumber(event.instructionChars)} chars<\u002Fdiv>${context}<span class=\"trace-outcome ${statusClass(outcome)}\">${escape(statusLabel(outcome))}<\u002Fspan><\u002Fdiv><div class=\"trace-time\">${shortDate(event.timestamp)}<\u002Fdiv><\u002Fdiv>`;\n        }).join(\"\");\n      }\n\n      function renderFiles(results) {\n        $(\"file-list\").innerHTML = SOURCE_KEYS.map((key) => {\n          const result = results[key];\n          return `<div class=\"file-item\"><span class=\"file-name\">${escape(result.path)}<\u002Fspan><span class=\"file-status ${result.exists ? \"loaded\" : \"\"}\">${result.exists ? `${formatNumber(result.text.length)} chars` : \"ausente\"}<\u002Fspan><\u002Fdiv>`;\n        }).join(\"\");\n      }\n\n      function renderArtifacts(results, manifest) {\n        const brief = results.brief.exists ? results.brief.text : \"\";\n        const progress = results.progress.exists ? results.progress.text : \"\";\n        const content = [brief && `BRIEF\\n${brief}`, progress && `PROGRESSO (tail)\\n${progress.split(/\\r?\\n/).slice(-12).join(\"\\n\")}`].filter(Boolean).join(\"\\n\\n\");\n        $(\"artifact-copy\").textContent = content || \"Nenhum brief ou progress.txt disponível.\";\n        const artifactCount = Array.isArray(manifest.files) ? manifest.files.length : 0;\n        $(\"artifact-meta\").textContent = `${artifactCount} artefato${artifactCount === 1 ? \"\" : \"s\"}`;\n      }\n\n      function render(results) {\n        const stateFile = parseJson(results.state, { Step: 0, Data: {}, CostChars: 0 });\n        const stateData = stateFile.Data || {};\n        const featureFile = parseJson(results.features, { items: [] });\n        const features = Array.isArray(featureFile) ? featureFile : (featureFile.items || []);\n        const { events, invalid } = parseTrace(results.trace.text);\n        const config = parseJson(results.config, {});\n        const manifest = parseJson(results.artifacts, { files: [] });\n        const latest = events.at(-1);\n        const currentId = stateData.current_feature_id;\n        const current = features.find((feature) => String(feature.id) === String(currentId));\n        const completed = features.filter((feature) => feature.passes === true).length;\n        const percentage = features.length ? Math.round((completed / features.length) * 100) : 0;\n        const derived = deriveStatus(stateFile, features, events);\n\n        $(\"progress-ring\").style.setProperty(\"--progress\", `${percentage}%`);\n        $(\"progress-value\").textContent = `${percentage}%`;\n        $(\"headline\").textContent = derived.label;\n        $(\"headline-detail\").textContent = derived.detail;\n        $(\"status-pill\").className = `status-pill ${derived.key}`;\n        $(\"status-text\").textContent = derived.label;\n        $(\"last-update\").textContent = latest ? `último evento ${shortDate(latest.timestamp)}` : \"sem eventos\";\n        $(\"run-source\").textContent = results.state.path.includes(\"last-\") ? \"snapshot\" : (results.state.exists ? \"ao vivo\" : \"sem dados\");\n        $(\"run-id\").textContent = text(config.runId);\n        $(\"target-dir\").textContent = text(config.targetDir);\n        $(\"verify-cmd\").textContent = text(config.verifyCmd);\n        $(\"current-feature\").textContent = current ? `#${text(current.id)} · ${text(current.title)}` : (currentId ? `#${currentId}` : \"—\");\n        $(\"metric-step\").textContent = formatNumber(stateFile.Step);\n        $(\"metric-step-sub\").textContent = latest ? `último: ${statusLabel(latest.outcome)}` : \"sem eventos\";\n        $(\"metric-features\").textContent = `${completed} / ${features.length}`;\n        $(\"metric-features-sub\").textContent = features.length ? `${features.length - completed} pendente${features.length - completed === 1 ? \"\" : \"s\"}` : \"backlog ainda não criado\";\n        $(\"metric-cost\").textContent = formatNumber(stateFile.CostChars);\n        $(\"metric-event\").textContent = latest ? statusLabel(latest.outcome) : \"—\";\n        $(\"metric-event-sub\").textContent = latest ? `passo #${text(latest.step)}` : \"trace.jsonl\";\n\n        renderFeatures(features, currentId);\n        renderTrace(events, invalid);\n        renderFiles(results);\n        renderArtifacts(results, manifest);\n\n        const hasAnyData = Object.values(results).some((result) => result.exists);\n        $(\"file-notice\").classList.toggle(\"show\", isFileProtocol);\n        $(\"file-notice-text\").textContent = isFileProtocol\n          ? \"Abra esta página por um servidor HTTP local (a leitura de arquivos é bloqueada quando o HTML é aberto diretamente como file://).\"\n          : hasAnyData ? \"\" : \"Nenhum arquivo de execução foi encontrado ainda.\";\n      }\n\n      function updateRefreshUi() {\n        $(\"refresh-dot\").className = `refresh-dot ${state.auto ? \"live\" : \"paused\"}`;\n        $(\"refresh-label\").textContent = state.auto ? \"Atualização automática\" : \"Atualização pausada\";\n        $(\"auto-toggle\").textContent = state.auto ? \"Pausar auto-refresh\" : \"Ativar auto-refresh\";\n        $(\"auto-toggle\").setAttribute(\"aria-pressed\", String(state.auto));\n      }\n\n      async function refresh() {\n        if (state.refreshPromise) return state.refreshPromise;\n        state.refreshPromise = readSources().then((results) => {\n          state.lastRead = new Date();\n          render(results);\n          $(\"read-at\").textContent = formatDate(state.lastRead);\n        }).catch((error) => {\n          $(\"file-notice\").classList.add(\"show\");\n          $(\"file-notice-text\").textContent = `Falha ao ler os artefatos; nova tentativa em ${REFRESH_MS / 1000}s. ${error.message || \"Verifique se o servidor .harness/gui/run.sh está no ar.\"}`;\n        }).finally(() => {\n          state.refreshPromise = null;\n        });\n        return state.refreshPromise;\n      }\n\n      function toggleAutoRefresh() {\n        state.auto = !state.auto;\n        localStorage.setItem(\"harness-gui-auto\", String(state.auto));\n        scheduleTick();\n      }\n      $(\"auto-toggle\").addEventListener(\"click\", toggleAutoRefresh);\n      $(\"refresh-state\").style.cursor = \"pointer\";\n      $(\"refresh-state\").addEventListener(\"click\", toggleAutoRefresh);\n\n      // ---------------------------------------------------------------------------------\n      // Router: 4 pages sharing one document — Dashboard, Specification, Development, Specs.\n      // ---------------------------------------------------------------------------------\n      const VIEWS = [\"dashboard\", \"specification\", \"development\", \"specs\"];\n      const VIEW_META = {\n        dashboard: { kicker: \"Harness GUI\", title: \"Dashboard\", subtitle: \"Visão geral do último estado registrado — atualização automática a cada 2s.\" },\n        specification: { kicker: \"Fluxo\", title: \"Specification\", subtitle: \"Controle do driver, pipeline de fases, documentos e aprovação.\" },\n        development: { kicker: \"Fluxo\", title: \"Development\", subtitle: \"Controle do driver que constrói o projeto feature a feature.\" },\n        specs: { kicker: \"Arquivos\", title: \"Specs · gestão de arquivos\", subtitle: \"Fontes usadas pelo specification, em specs/sources.\" },\n      };\n\n      function showView(name) {\n        const view = VIEWS.includes(name) ? name : \"dashboard\";\n        VIEWS.forEach((v) => { $(`view-${v}`).hidden = v !== view; });\n        document.querySelectorAll(\".nav-item\").forEach((item) => item.classList.toggle(\"active\", item.dataset.view === view));\n        const meta = VIEW_META[view];\n        $(\"page-kicker\").textContent = meta.kicker;\n        $(\"page-title\").textContent = meta.title;\n        $(\"page-subtitle\").textContent = meta.subtitle;\n        localStorage.setItem(\"harness-gui-view\", view);\n        if (location.hash.slice(1) !== view) location.hash = view;\n        state.activeView = view;\n        if (view === \"specification\") loadSpecificationExtras();\n        if (view === \"specs\") loadSources();\n      }\n\n      document.querySelectorAll(\".nav-item\").forEach((item) => {\n        item.addEventListener(\"click\", () => showView(item.dataset.view));\n      });\n      window.addEventListener(\"hashchange\", () => showView(location.hash.slice(1)));\n\n      // ---------------------------------------------------------------------------------\n      // Per-flow controller: driver select, confirm gate, start/stop, live console.\n      // Specification and Development each get their own instance, so both can run at once.\n      // ---------------------------------------------------------------------------------\n      function createFlowController(flow) {\n        return {\n          flow,\n          driver: localStorage.getItem(`harness-gui-driver-${flow}`) || \"claude\",\n          confirmed: false,\n          logOffset: 0,\n          logFile: null,\n          knownStatus: \"idle\",\n          approvalAvailable: false,\n          ids: {\n            driverSelect: `driver-select-${flow}`,\n            driverNote: `driver-note-${flow}`,\n            wrapperNote: `wrapper-note-${flow}`,\n            statusPill: `process-status-pill-${flow}`,\n            statusText: `process-status-text-${flow}`,\n            confirmCheckbox: `confirm-checkbox-${flow}`,\n            startButton: `start-button-${flow}`,\n            stopButton: `stop-button-${flow}`,\n            controlError: `control-error-${flow}`,\n            activeBadge: `active-badge-${flow}`,\n            consoleLog: `console-log-${flow}`,\n            consoleMeta: `console-meta-${flow}`,\n            navStatus: `nav-status-${flow}`,\n          },\n        };\n      }\n\n      const specification = createFlowController(\"specification\");\n      const development = createFlowController(\"development\");\n      const controllers = { specification, development };\n      let flowsMeta = {};\n      let driversMeta = {};\n      // Dedicated to the Approve action — deliberately NOT specification.confirmed (that one\n      // gates starting an autonomous background driver, a much broader consent; reusing it\n      // here just made the button look permanently, silently disabled to anyone who hadn't\n      // also filled in the unrelated driver panel above).\n      let approveConfirmed = false;\n\n      function statusLabelPt(status) {\n        return {\n          idle: \"Ocioso\", running: \"Em execução\", stopping: \"Parando…\",\n          stopped: \"Parado\", crashed: \"Encerrou inesperadamente\", error: \"Erro\",\n        }[status] || status || \"Ocioso\";\n      }\n\n      function updateNotes(c) {\n        const driverMeta = driversMeta[c.driver];\n        const missingBinary = driverMeta && driverMeta.validated && !driverMeta.binaryAvailable\n          ? \" CLI não encontrada no PATH desta máquina — instale-a para habilitar este driver.\" : \"\";\n        $(c.ids.driverNote).textContent = (driverMeta?.note || \"\") + missingBinary;\n        const flowMeta = flowsMeta[c.flow];\n        $(c.ids.wrapperNote).textContent = flowMeta && !flowMeta.available ? `Wrapper ${flowMeta.wrapper} não encontrado no repositório.` : \"\";\n      }\n\n      function updateApproveButton() {\n        const btn = $(\"approve-button\");\n        if (!btn) return;\n        const running = specification.knownStatus === \"running\" || specification.knownStatus === \"stopping\";\n        btn.disabled = running || !approveConfirmed || !specification.approvalAvailable;\n        // Whichever of the three gates is failing, right on the button itself — a plain hover\n        // (or a screen reader) should be enough to tell why, without opening devtools.\n        btn.title = running\n          ? `Bloqueado: o driver ainda está \"${statusLabelPt(specification.knownStatus)}\" para este fluxo. Pare-o no painel de controle acima.`\n          : !specification.approvalAvailable\n          ? \"Bloqueado: nenhuma proposta de aprovação pendente foi encontrada (.harness/specification/active/approval.proposal.json).\"\n          : !approveConfirmed\n          ? \"Bloqueado: marque a caixa de confirmação acima antes de aprovar.\"\n          : \"\";\n      }\n\n      function updateButtons(c) {\n        const running = c.knownStatus === \"running\" || c.knownStatus === \"stopping\";\n        const driverMeta = driversMeta[c.driver];\n        const canStart = !running && c.confirmed && driverMeta?.validated && driverMeta?.binaryAvailable && flowsMeta[c.flow]?.available;\n        $(c.ids.startButton).disabled = !canStart;\n        $(c.ids.stopButton).disabled = c.knownStatus !== \"running\";\n        $(c.ids.driverSelect).disabled = running;\n        $(c.ids.activeBadge).classList.toggle(\"show\", running);\n        if (c.flow === \"specification\") updateApproveButton();\n      }\n\n      function initController(c) {\n        const select = $(c.ids.driverSelect);\n        select.innerHTML = Object.entries(driversMeta).map(([key, meta]) => {\n          const usable = meta.validated && meta.binaryAvailable;\n          const suffix = !meta.validated ? \" (não validado)\" : !meta.binaryAvailable ? \" (CLI não encontrada no PATH)\" : \"\";\n          return `<option value=\"${escape(key)}\" ${usable ? \"\" : \"disabled\"}>${escape(meta.label || key)}${suffix}<\u002Foption>`;\n        }).join(\"\");\n        if (driversMeta[c.driver]?.validated && driversMeta[c.driver]?.binaryAvailable) {\n          select.value = c.driver;\n        } else {\n          const firstUsable = Object.entries(driversMeta).find(([, meta]) => meta.validated && meta.binaryAvailable);\n          if (firstUsable) select.value = c.driver = firstUsable[0];\n        }\n        select.addEventListener(\"change\", (event) => {\n          c.driver = event.target.value;\n          localStorage.setItem(`harness-gui-driver-${c.flow}`, c.driver);\n          updateNotes(c);\n          updateButtons(c);\n        });\n\n        $(c.ids.confirmCheckbox).addEventListener(\"change\", (event) => {\n          c.confirmed = event.target.checked;\n          updateButtons(c);\n        });\n        $(c.ids.startButton).addEventListener(\"click\", () => startFlow(c));\n        $(c.ids.stopButton).addEventListener(\"click\", () => stopFlow(c));\n\n        updateNotes(c);\n        updateButtons(c);\n      }\n\n      async function loadFlowMeta() {\n        const [flowsRes, driversRes] = await Promise.all([\n          fetch(\"/api/flows\", { cache: \"no-store\" }).then((r) => r.json()).catch(() => ({})),\n          fetch(\"/api/drivers\", { cache: \"no-store\" }).then((r) => r.json()).catch(() => ({})),\n        ]);\n        flowsMeta = flowsRes || {};\n        driversMeta = driversRes || {};\n        Object.values(controllers).forEach(initController);\n      }\n\n      async function refreshStatus(c) {\n        try {\n          const response = await fetch(`/api/process?flow=${encodeURIComponent(c.flow)}&_=${Date.now()}`, { cache: \"no-store\" });\n          const data = await response.json();\n          c.knownStatus = data.status || \"idle\";\n          $(c.ids.statusPill).className = `status-pill ${c.knownStatus}`;\n          $(c.ids.statusText).textContent = statusLabelPt(c.knownStatus);\n          $(c.ids.consoleMeta).textContent = data.pid ? `pid ${data.pid} · ${data.driver || \"\"}` : \"nenhum processo\";\n          const navStatus = $(c.ids.navStatus);\n          if (navStatus) {\n            navStatus.className = `nav-status ${c.knownStatus}`;\n            navStatus.title = statusLabelPt(c.knownStatus);\n          }\n          if (data.logFile && data.logFile !== c.logFile) {\n            c.logFile = data.logFile;\n            c.logOffset = 0;\n            $(c.ids.consoleLog).textContent = \"\";\n          }\n          updateButtons(c);\n          const shouldPollLogs = data.logFile && (c.knownStatus === \"running\" || c.knownStatus === \"stopping\" || state.activeView === c.flow);\n          if (shouldPollLogs) await pollLogs(c);\n        } catch (_) {\n          // Server may be mid-restart; the next tick will retry.\n        }\n      }\n\n      async function pollLogs(c) {\n        try {\n          const response = await fetch(`/api/process/logs?flow=${encodeURIComponent(c.flow)}&since=${c.logOffset}&_=${Date.now()}`, { cache: \"no-store\" });\n          const data = await response.json();\n          if (data.logFile && data.logFile !== c.logFile) {\n            c.logFile = data.logFile;\n            c.logOffset = 0;\n          }\n          if (data.text) {\n            const box = $(c.ids.consoleLog);\n            const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 12;\n            box.textContent += data.text;\n            c.logOffset = data.offset;\n            if (atBottom) box.scrollTop = box.scrollHeight;\n          }\n        } catch (_) { /* retried next tick */ }\n      }\n\n      async function startFlow(c) {\n        $(c.ids.controlError).textContent = \"\";\n        $(c.ids.startButton).disabled = true;\n        try {\n          const response = await fetch(\"/api/process/start\", {\n            method: \"POST\",\n            headers: { \"Content-Type\": \"application/json\" },\n            body: JSON.stringify({ driver: c.driver, flow: c.flow }),\n          });\n          const data = await response.json();\n          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);\n          c.logFile = data.logFile || null;\n          c.logOffset = 0;\n          $(c.ids.consoleLog).textContent = \"\";\n          await refreshStatus(c);\n        } catch (error) {\n          $(c.ids.controlError).textContent = error.message || String(error);\n        } finally {\n          updateButtons(c);\n        }\n      }\n\n      async function stopFlow(c) {\n        $(c.ids.controlError).textContent = \"\";\n        $(c.ids.stopButton).disabled = true;\n        try {\n          const response = await fetch(\"/api/process/stop\", {\n            method: \"POST\",\n            headers: { \"Content-Type\": \"application/json\" },\n            body: JSON.stringify({ flow: c.flow }),\n          });\n          const data = await response.json();\n          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);\n          await refreshStatus(c);\n        } catch (error) {\n          $(c.ids.controlError).textContent = error.message || String(error);\n        } finally {\n          updateButtons(c);\n        }\n      }\n\n      // ---------------------------------------------------------------------------------\n      // Specification pipeline stepper + documents (Idea/PRD/SRS/SDD/Review/Approval) + approve.\n      // ---------------------------------------------------------------------------------\n      const SPECIFICATION_PHASES_FALLBACK = [\"start\", \"discover\", \"product\", \"analysis\", \"design\", \"review\", \"approve\", \"stop\"];\n      const DOCUMENT_FAMILIES = [\n        { title: \"Fontes\", items: [\"sources\"] },\n        { title: \"Ideia\", items: [\"idea_proposal\", \"idea_accepted\"] },\n        { title: \"PRD\", items: [\"prd_proposal\", \"prd_accepted\"] },\n        { title: \"SRS\", items: [\"srs_proposal\", \"srs_accepted\"] },\n        { title: \"SDD\", items: [\"sdd_proposal\", \"sdd_accepted\"] },\n        { title: \"Review / Readiness\", items: [\"review_proposal\", \"readiness_accepted\"] },\n        { title: \"Aprovação\", items: [\"approval_proposal\"] },\n      ];\n\n      function renderPipeline(pipeline) {\n        const phases = Array.isArray(pipeline.phases) && pipeline.phases.length ? pipeline.phases : SPECIFICATION_PHASES_FALLBACK;\n        const currentIndex = phases.indexOf(pipeline.phase);\n        $(\"pipeline-meta\").textContent = pipeline.exists ? `passo #${text(pipeline.step)} · ${text(pipeline.status, \"—\").replace(/_/g, \" \")}` : \"nenhuma execução registrada\";\n        $(\"pipeline-stepper\").innerHTML = phases.map((phase, index) => {\n          let cls = \"\";\n          if (pipeline.exists) {\n            if (index < currentIndex) cls = \"done\";\n            else if (index === currentIndex) cls = \"current\";\n          }\n          return `<div class=\"pipeline-step ${cls}\"><span class=\"pipeline-step-dot\"><\u002Fspan><span class=\"pipeline-step-label\">${escape(phase)}<\u002Fspan><\u002Fdiv>`;\n        }).join(\"\");\n        const fault = $(\"pipeline-fault\");\n        if (pipeline.terminalReason) {\n          fault.hidden = false;\n          fault.textContent = `O engine recusa qualquer novo turno (inclusive \"Aprovar\") até isso ser resolvido: ${pipeline.terminalReason}. Verifique .harness/harness.log para o erro completo; recuperar exige reenviar \"start\" para este fluxo.`;\n        } else {\n          fault.hidden = true;\n        }\n      }\n\n      function familyStatus(items, byKey) {\n        const accepted = items.filter((key) => key.endsWith(\"_accepted\") || key === \"sources\");\n        const proposed = items.filter((key) => key.endsWith(\"_proposal\"));\n        if (accepted.some((key) => byKey[key]?.exists)) return \"accepted\";\n        if (proposed.some((key) => byKey[key]?.exists)) return \"proposed\";\n        return \"pending\";\n      }\n\n      function renderDocuments(documents) {\n        const byKey = Object.fromEntries(documents.map((doc) => [doc.key, doc]));\n        const existing = documents.filter((doc) => doc.exists).length;\n        $(\"documents-meta\").textContent = `${existing} / ${documents.length} arquivos`;\n        const statusLabelPtDoc = { accepted: \"aceito\", proposed: \"proposto\", pending: \"pendente\" };\n        $(\"documents-list\").innerHTML = DOCUMENT_FAMILIES.map((family) => {\n          const status = familyStatus(family.items, byKey);\n          const entries = family.items.map((key) => {\n            const doc = byKey[key];\n            if (!doc || !doc.exists) return \"\";\n            const targetId = `doc-content-${key}`;\n            return `<div class=\"document-entry\">\n              <button type=\"button\" class=\"document-toggle\" data-target=\"${targetId}\"><span>${escape(doc.label)}<\u002Fspan><span class=\"field-note\" style=\"margin:0;\">${escape(shortDate(doc.modifiedAt))}<\u002Fspan><\u002Fbutton>\n              <pre class=\"artifact-copy\" id=\"${targetId}\" hidden>${escape(JSON.stringify(doc.content, null, 2))}<\u002Fpre>\n            <\u002Fdiv>`;\n          }).join(\"\") || '<div class=\"empty\">Ainda não gerado.<\u002Fdiv>';\n          return `<div class=\"document-card\">\n            <div class=\"document-card-head\"><h3>${escape(family.title)}<\u002Fh3><span class=\"status-pill ${status}\">${statusLabelPtDoc[status]}<\u002Fspan><\u002Fdiv>\n            ${entries}\n          <\u002Fdiv>`;\n        }).join(\"\");\n        document.querySelectorAll(\".document-toggle\").forEach((button) => {\n          button.addEventListener(\"click\", () => {\n            const target = document.getElementById(button.getAttribute(\"data-target\"));\n            if (target) target.hidden = !target.hidden;\n          });\n        });\n      }\n\n      function renderApprovalPanel(pipeline, documents) {\n        const panel = $(\"approval-panel-specification\");\n        const pending = Boolean(pipeline.exists && pipeline.status === \"awaiting_approval\");\n        panel.hidden = !pending;\n        if (!pending && approveConfirmed) {\n          // A previous decision's confirmation shouldn't silently carry over and pre-arm the\n          // button for whatever shows up next time the panel becomes visible again.\n          approveConfirmed = false;\n          const checkbox = $(\"confirm-checkbox-approve\");\n          if (checkbox) checkbox.checked = false;\n        }\n        const proposal = documents.find((doc) => doc.key === \"approval_proposal\");\n        // A READY run is itself the approval gate. Older runs may not have an\n        // approval.proposal.json yet because the proposal is the human decision\n        // submitted by the GUI, not an artifact produced by the review phase.\n        specification.approvalAvailable = pending;\n        if (pending) {\n          $(\"approval-run-status\").textContent = text(pipeline.status);\n          const content = proposal?.content || {};\n          $(\"approval-summary\").innerHTML = `\n            <div class=\"data-row\"><dt>Decisão<\u002Fdt><dd>${escape(content.decision)}<\u002Fdd><\u002Fdiv>\n            <div class=\"data-row\"><dt>Aprovado por<\u002Fdt><dd>${escape(content.approvedBy)}<\u002Fdd><\u002Fdiv>\n            <div class=\"data-row\"><dt>Decidido em<\u002Fdt><dd>${escape(shortDate(content.decidedAt))}<\u002Fdd><\u002Fdiv>\n            <div class=\"data-row\"><dt>Racional<\u002Fdt><dd>${escape(content.rationale || \"Será registrado ao confirmar nesta GUI.\")}<\u002Fdd><\u002Fdiv>\n          `;\n        }\n        updateApproveButton();\n      }\n\n      async function loadSpecificationExtras() {\n        try {\n          const [pipeline, documentsRes] = await Promise.all([\n            fetch(`/api/specification/pipeline?_=${Date.now()}`, { cache: \"no-store\" }).then((r) => r.json()),\n            fetch(`/api/specification/documents?_=${Date.now()}`, { cache: \"no-store\" }).then((r) => r.json()),\n          ]);\n          const documents = documentsRes.documents || [];\n          renderPipeline(pipeline);\n          renderDocuments(documents);\n          renderApprovalPanel(pipeline, documents);\n        } catch (_) { /* retried next tick */ }\n      }\n\n      $(\"confirm-checkbox-approve\").addEventListener(\"change\", (event) => {\n        approveConfirmed = event.target.checked;\n        updateApproveButton();\n      });\n\n      $(\"approve-button\").addEventListener(\"click\", async () => {\n        $(\"approve-error\").textContent = \"\";\n        $(\"approve-button\").disabled = true;\n        $(\"approve-button\").textContent = \"Aprovando…\";\n        try {\n          const response = await fetch(\"/api/specification/approve\", {\n            method: \"POST\",\n            headers: { \"Content-Type\": \"application/json\" },\n            body: \"{}\",\n          });\n          const data = await response.json();\n          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);\n          const result = $(\"approve-result\");\n          result.hidden = false;\n          result.textContent = `exit code: ${data.exitCode}\\n\\n--- stdout ---\\n${data.stdout || \"(vazio)\"}\\n\\n--- stderr ---\\n${data.stderr || \"(vazio)\"}`;\n          await loadSpecificationExtras();\n          await refresh();\n        } catch (error) {\n          $(\"approve-error\").textContent = error.message || String(error);\n        } finally {\n          $(\"approve-button\").textContent = \"Aprovar\";\n          updateApproveButton();\n        }\n      });\n\n      // ---------------------------------------------------------------------------------\n      // Sources manager (specs/sources) — dedicated \"Specs\" page, always available.\n      // ---------------------------------------------------------------------------------\n      async function loadSources() {\n        try {\n          const response = await fetch(`/api/sources?_=${Date.now()}`, { cache: \"no-store\" });\n          const data = await response.json();\n          renderSources(data);\n        } catch (_) { /* retried on next auto-refresh tick */ }\n      }\n\n      function renderSources(data) {\n        const files = data.files || [];\n        $(\"sources-meta\").textContent = `${files.length} arquivo${files.length === 1 ? \"\" : \"s\"}`;\n        const list = $(\"sources-list\");\n        list.innerHTML = files.length ? files.map((file) => `\n          <div class=\"file-item\">\n            <span class=\"file-name\">${escape(file.name)}<\u002Fspan>\n            <span class=\"sources-item-actions\">\n              <span class=\"file-status loaded\">${formatNumber(file.sizeBytes)} bytes<\u002Fspan>\n              <button type=\"button\" data-delete=\"${escape(file.name)}\">apagar<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fdiv>`).join(\"\") : '<div class=\"empty\">Nenhum arquivo em specs/sources ainda.<\u002Fdiv>';\n        list.querySelectorAll(\"[data-delete]\").forEach((button) => {\n          button.addEventListener(\"click\", () => deleteSource(button.getAttribute(\"data-delete\")));\n        });\n        const total = data.totalBytes || 0;\n        const max = data.docsMaxChars || 1;\n        const ratio = Math.min(total / max, 1);\n        $(\"budget-fill\").style.width = `${ratio * 100}%`;\n        $(\"budget-label\").textContent = `${formatNumber(total)} / ${formatNumber(max)} bytes usados em specs/sources`;\n      }\n\n      async function deleteSource(name) {\n        try {\n          const response = await fetch(`/api/sources/${encodeURIComponent(name)}`, { method: \"DELETE\" });\n          const data = await response.json();\n          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);\n          await loadSources();\n        } catch (error) {\n          $(\"sources-status\").textContent = error.message || String(error);\n          $(\"sources-status\").className = \"sources-status error\";\n        }\n      }\n\n      $(\"sources-file-input\").addEventListener(\"change\", async (event) => {\n        const file = event.target.files[0];\n        if (!file) return;\n        const content = await file.text();\n        $(\"sources-filename\").value = file.name;\n        $(\"sources-content\").value = content;\n      });\n\n      $(\"sources-form\").addEventListener(\"submit\", async (event) => {\n        event.preventDefault();\n        const filename = $(\"sources-filename\").value.trim();\n        const content = $(\"sources-content\").value;\n        $(\"sources-status\").textContent = \"\";\n        try {\n          const response = await fetch(\"/api/sources\", {\n            method: \"POST\",\n            headers: { \"Content-Type\": \"application/json\" },\n            body: JSON.stringify({ filename, content }),\n          });\n          const data = await response.json();\n          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);\n          $(\"sources-status\").textContent = `Salvo: ${data.name}`;\n          $(\"sources-status\").className = \"sources-status ok\";\n          $(\"sources-form\").reset();\n          await loadSources();\n        } catch (error) {\n          $(\"sources-status\").textContent = error.message || String(error);\n          $(\"sources-status\").className = \"sources-status error\";\n        }\n      });\n\n      // ---------------------------------------------------------------------------------\n      // Boot: initial view, then the periodic refresh loop covering dashboard + both flows.\n      // ---------------------------------------------------------------------------------\n      async function tick() {\n        await refresh();\n        await Promise.all([refreshStatus(specification), refreshStatus(development)]);\n        if (state.activeView === \"specification\") await loadSpecificationExtras();\n      }\n\n      function scheduleTick() {\n        clearInterval(state.timer);\n        state.timer = state.auto ? setInterval(tick, REFRESH_MS) : null;\n        updateRefreshUi();\n      }\n      $(\"refresh-button\").addEventListener(\"click\", tick);\n\n      const initialView = location.hash.slice(1) || localStorage.getItem(\"harness-gui-view\") || \"dashboard\";\n      showView(initialView);\n      loadFlowMeta();\n      scheduleTick();\n      tick();\n    })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
<script>
(() => {
  const attachApprovalFeedback = () => {
    const button = document.getElementById("approve-button");
    if (!button || button.dataset.feedbackAttached) return;
    button.dataset.feedbackAttached = "1";
    button.addEventListener("click", () => {
      const startedAt = Date.now();
      const timer = setInterval(async () => {
        const result = document.getElementById("approve-result");
        if (!result || result.hidden || Date.now() - startedAt < 200) return;
        clearInterval(timer);
        try {
          const response = await fetch(`/api/specification/pipeline?_=${Date.now()}`, { cache: "no-store" });
          const pipeline = await response.json();
          const status = pipeline.status || "desconhecido";
          const marker = status === "completed" ? "APROVAÇÃO CONCLUÍDA" : "APROVAÇÃO NÃO CONCLUÍDA";
          if (!result.textContent.startsWith(marker)) result.textContent = `${marker}\nstatus: ${status}\n\n${result.textContent}`;
        } catch (_) {}
      }, 250);
      setTimeout(() => clearInterval(timer), 125000);
    }, true);
  };
  attachApprovalFeedback();
  new MutationObserver(attachApprovalFeedback).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

    .artifact-chat { display: grid; gap: 10px; margin: 0 0 20px; padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--soft); }

  // Console log: reformat the raw streamed text (NDJSON driver events + plain stderr
