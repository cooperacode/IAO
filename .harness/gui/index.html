    const ICONS = {
      info: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="5.2" r="0.9" fill="currentColor"/><line x1="8" y1="7.4" x2="8" y2="11.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
      warning: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2 L14.3 13.2 L1.7 13.2 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><line x1="8" y1="6.3" x2="8" y2="9.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.4" r="0.9" fill="currentColor"/></svg>',
      error: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="5.6" y1="5.6" x2="10.4" y2="10.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10.4" y1="5.6" x2="5.6" y2="10.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    };

    function classify(line) {
      const trimmed = line.trim();
      if (!trimmed) return "info";
      if (trimmed[0] === "{") {
        try {
          const evt = JSON.parse(trimmed);
          const exitCode = evt.item?.exit_code ?? evt.exit_code;
          if (evt.is_error === true) return "error";
          if (typeof exitCode === "number" && exitCode !== 0) return "error";
          const signals = [evt.type, evt.item?.type, evt.item?.status, evt.status, evt.level]
            .filter(Boolean).join(" ").toLowerCase();
          if (/error|fail|exception/.test(signals)) return "error";
          if (/warn/.test(signals)) return "warning";
          return "info";
        } catch (_) { /* not a JSON event line — fall through to plain-text heuristics */ }
      }
      if (/\b(error|erro|exception|traceback|failed|falhou)\b/i.test(trimmed)) return "error";
      if (/\b(warn(ing)?|aviso|atenção)\b/i.test(trimmed)) return "warning";
      return "info";
    }

    function buildRow(text, expanded) {
      const kind = classify(text);
      const row = document.createElement("div");
      row.className = expanded ? "console-log-line expanded" : "console-log-line";
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.setAttribute("aria-expanded", expanded ? "true" : "false");
      const icon = document.createElement("span");
      icon.className = `console-log-line-icon ${kind}`;
      icon.innerHTML = ICONS[kind];
      const label = document.createElement("span");
      label.className = "console-log-line-text";
      label.textContent = text;
      row.append(icon, label);
      const toggle = () => {
        const next = row.classList.toggle("expanded");
        row.setAttribute("aria-expanded", String(next));
      };
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); }
      });
      return row;
    }

    function render(raw) {
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 12;
      const expanded = new Set();
      box.querySelectorAll(".console-log-line.expanded > .console-log-line-text")
        .forEach((el) => expanded.add(el.textContent));
      box.innerHTML = "";
      if (!raw || raw.trim() === IDLE_TEXT) {
        const empty = document.createElement("div");
        empty.className = "console-log-empty";
        empty.textContent = IDLE_TEXT;
        box.append(empty);
        box.dataset.lastRendered = raw || "";
        return;
      }
      const endsWithNewline = raw.endsWith("\n");
      const lines = (endsWithNewline ? raw.slice(0, -1) : raw).split("\n");
      const visibleFrom = Math.max(0, lines.length - MAX_LINES);
      const frag = document.createDocumentFragment();
      if (visibleFrom > 0) {
        // Older lines stop getting a row (bounds DOM size on very long sessions), but their
        // exact text stays in a hidden node — box.textContent, which "Copiar log" reads,
        // always reconstructs the *complete* history, never just what is currently on screen.
        const older = document.createElement("span");
        older.hidden = true;
        older.textContent = lines.slice(0, visibleFrom).join("\n") + "\n";
        frag.append(older);
        const notice = document.createElement("div");
        notice.className = "console-log-empty";
        notice.textContent = `… ${visibleFrom} linha(s) mais antigas ocultas (incluídas ao copiar) …`;
        frag.append(notice);
      }
      lines.slice(visibleFrom).forEach((line) => {
        frag.append(buildRow(line, expanded.has(line)));
        frag.append(document.createTextNode("\n"));
      });
      if (!endsWithNewline) frag.lastChild?.remove();
      box.append(frag);
      box.dataset.lastRendered = raw;
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    render(box.textContent);
    new MutationObserver(() => {
      const raw = box.textContent;
      if (raw === box.dataset.lastRendered) return;
      render(raw);
    }).observe(box, { childList: true });
  }
  ["specification", "development"].forEach(enableConsoleLogLines);

  // Adds a "Copiar log" button to the console panel heading. Reads box.textContent at
  // click time — which, thanks to enableConsoleLogLines() above keeping every line (even
  // hidden ones) represented as real text nodes, always holds the complete raw log, not
  // just the portion currently rendered as rows.
  function enableConsoleLogCopy(flow) {
    const box = document.getElementById(`console-log-${flow}`);
    const meta = document.getElementById(`console-meta-${flow}`);
    const heading = meta?.closest(".panel-heading");
    if (!box || !meta || !heading || heading.dataset.copyReady) return;
    heading.dataset.copyReady = "1";
    const actions = document.createElement("div");
    actions.className = "panel-heading-actions";
    meta.replaceWith(actions);
    actions.append(meta);
    const ICON_COPY = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.3 10.3V3.7A1.4 1.4 0 0 1 4.7 2.3h6.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
    const ICON_CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const button = document.createElement("button");
    button.type = "button";
    button.className = "console-log-copy-button";
    button.innerHTML = `${ICON_COPY}<span>Copiar log</span>`;
    let resetTimer = null;
    function setState(ok, message) {
      clearTimeout(resetTimer);
      button.classList.toggle("copied", ok === true);
      button.innerHTML = `${ok ? ICON_CHECK : ICON_COPY}<span>${message}</span>`;
      resetTimer = setTimeout(() => {
        button.classList.remove("copied");
        button.innerHTML = `${ICON_COPY}<span>Copiar log</span>`;
      }, 1700);
    }
    button.addEventListener("click", async () => {
      const text = box.textContent || "";
      try {
        await navigator.clipboard.writeText(text);
        setState(true, "Copiado!");
        return;
      } catch (_) { /* clipboard API unavailable (file://, insecure context…) — fall back below */ }
      try {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none;";
        document.body.appendChild(helper);
        helper.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(helper);
        setState(ok, ok ? "Copiado!" : "Falha ao copiar");
      } catch (_) {
        setState(false, "Falha ao copiar");
      }
    });
    actions.append(button);
  }
  ["specification", "development"].forEach(enableConsoleLogCopy);

  function ensureDevelopmentPipeline() {
    const view = document.getElementById("view-development");
    if (!view || document.getElementById("development-pipeline-panel")) return;
    const panel = document.createElement("section");
    panel.id = "development-pipeline-panel";
    panel.className = "panel pipeline-panel development-pipeline-panel";
    panel.innerHTML = '<div class="panel-heading"><h2>Pipeline</h2><span class="meta" id="development-pipeline-meta">carregando progresso</span></div><div id="development-pipeline-stepper" class="pipeline-stepper development-pipeline-stepper"></div><p id="development-pipeline-note" class="development-pipeline-current" hidden></p>';
    const consolePanel = view.querySelector("#console-log-development")?.closest(".panel");
    view.insertBefore(panel, consolePanel || null);
  }

  function renderDevelopmentPipeline(stateFile, featureFile) {
    ensureDevelopmentPipeline();
    const meta = document.getElementById("development-pipeline-meta");
    const stepper = document.getElementById("development-pipeline-stepper");
    const note = document.getElementById("development-pipeline-note");
    if (!meta || !stepper || !note) return;
    const stateData = stateFile?.Data || stateFile?.data || {};
    const features = Array.isArray(featureFile) ? featureFile : (featureFile?.items || []);
    const currentId = stateData.current_feature_id;
    const completed = features.filter((feature) => feature.passes === true).length;
    meta.textContent = features.length ? `${completed} / ${features.length} concluídas` : "sem features registradas";
    if (!features.length) {
      stepper.innerHTML = '<div class="development-pipeline-empty">O pipeline aparecerá quando o backlog de Development estiver disponível.</div>';
      note.hidden = true;
      return;
    }
    stepper.innerHTML = features.map((feature) => {
      const done = feature.passes === true;
      const current = String(feature.id) === String(currentId) && !done;
      const cls = done ? "done" : current ? "current" : "";
      const state = done ? "concluída" : current ? "em andamento" : "pendente";
      return `<div class="pipeline-step ${cls}" title="${escapePublished(feature.title || `Feature #${feature.id}`)} · ${state}"><span class="pipeline-step-dot"></span><span class="pipeline-step-label">#${escapePublished(feature.id)} · ${escapePublished(feature.title || "Feature sem título")}</span></div>`;
    }).join("");
    const current = features.find((feature) => String(feature.id) === String(currentId) && feature.passes !== true);
    const terminalReason = stateFile?.terminalReason || stateFile?.TerminalReason || stateData.terminalReason || stateData.TerminalReason;
    if (terminalReason) {
      note.hidden = false;
      note.textContent = `Fluxo interrompido: ${terminalReason}`;
    } else if (current) {
      note.hidden = false;
      note.textContent = `Em andamento: #${current.id} · ${current.title || "Feature sem título"}`;
    } else {
      note.hidden = true;
    }
  }

  async function loadDevelopmentPipeline() {
    ensureDevelopmentPipeline();
    try {
      const [stateResponse, featuresResponse] = await Promise.all([
        fetch(`/api/files/state?_=${Date.now()}`, { cache: "no-store" }).then((response) => response.json()),
        fetch(`/api/files/features?_=${Date.now()}`, { cache: "no-store" }).then((response) => response.json()),
      ]);
      const stateFile = stateResponse.exists ? JSON.parse(stateResponse.text) : {};
      const featureFile = featuresResponse.exists ? JSON.parse(featuresResponse.text) : {};
      renderDevelopmentPipeline(stateFile, featureFile);
    } catch (_) {
      const meta = document.getElementById("development-pipeline-meta");
      if (meta) meta.textContent = "não foi possível ler o progresso";
    }
  }
  ensureDevelopmentPipeline();
  loadDevelopmentPipeline();
  setInterval(loadDevelopmentPipeline, 1500);

  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const url = typeof input === "string" ? input : input?.url || "";
    if (url.includes("/api/process/start") && init?.body) {
      try {
        const body = JSON.parse(init.body);
        const modelSelect = document.getElementById(`model-select-${body.flow}`);
        if (modelSelect) {
          body.model = modelSelect.value || "";
          init = { ...init, body: JSON.stringify(body) };
        }
      } catch (_) {}
    }
    return nativeFetch(input, init);
  };
  publishedReader.querySelector("[data-published-close]").addEventListener("click", closePublished);
  document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !publishedReader.hidden) closePublished(); });
})();
</script>
</body>
